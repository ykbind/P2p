<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropIt — Secure P2P File Transfer</title>
    <meta name="description" content="Transfer files directly between browsers with end-to-end encryption. No uploads, no cloud storage, just instant P2P transfer.">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>DropIT</h1>
            <p class="subtitle">Secure, Browser-to-Browser File Transfer</p>

            <!-- ── Drop / Browse zone ── -->
            <div id="dropZone" class="drop-zone" role="button" tabindex="0"
                 aria-label="Drop a file here or tap to browse"
                 onclick="document.getElementById('fileInput').click()"
                 onkeydown="if(event.key==='Enter'||event.key===' ')document.getElementById('fileInput').click()">
                <span class="drop-icon" aria-hidden="true">🚀</span>
                <p id="dropText">Drop a file here or tap to browse</p>
                <p class="drop-hint">Direct P2P &bull; End-to-End Encrypted</p>
                <input type="file" id="fileInput" hidden onchange="handleFile(this.files)">
            </div>

            <!-- ── Session / share link ── -->
            <div id="sessionInfo" style="display: none;" class="mt-4">
                <p class="text-center label-sm">Share this link with the receiver</p>
                <div class="share-box">
                    <span id="shareLink"></span>
                    <div class="share-actions">
                        <button id="copyBtn" onclick="copyToClipboard()" class="btn" aria-label="Copy link">Copy</button>
                        <button onclick="toggleQR()" class="btn btn--secondary" aria-label="Show QR code">QR</button>
                    </div>
                </div>

                <!-- QR Code -->
                <div id="qrContainer" style="display: none;" class="qr-container">
                    <div id="qrcode"></div>
                </div>

                <!-- Status line -->
                <div class="mt-4 text-center">
                    <p id="statusText"><span class="pulse pulse--wait"></span>Waiting for connection…</p>
                </div>
            </div>

            <!-- ── Transfer progress ── -->
            <div id="transferInfo" style="display: none;" class="mt-4">
                <div class="stats-grid stats-grid--4">
                    <div class="stat-item">
                        <span class="stat-label">Progress</span>
                        <span id="progressPercent" class="stat-value">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Speed</span>
                        <span id="speedText" class="stat-value">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">ETA</span>
                        <span id="etaText" class="stat-value">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Size</span>
                        <span id="fileSizeText" class="stat-value">—</span>
                    </div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- ── Error card ── -->
            <div id="errorCard" class="error-card mt-4" style="display: none;">
                <span class="error-icon">⚠️</span>
                <p class="error-msg"></p>
                <button class="btn btn--sm" onclick="location.reload()">Try Again</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="/tos">Terms</a>
        <a href="/privacy">Privacy</a>
        <a href="/about">About Us</a>
    </div>

    <script src="/static/fileHandler.js"></script>
    <script src="/static/webrtc.js"></script>
    <script src="/static/sender.js"></script>
    <script>
        // --- QR Code toggle ---
        let qrVisible = false;
        let qrInited  = false;

        function copyToClipboard() {
            const link = document.getElementById('shareLink').innerText;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = 'Copied!';
                btn.style.background = 'var(--success)';
                setTimeout(() => {
                    btn.innerText = 'Copy';
                    btn.style.background = '';
                }, 2000);
            });
        }

        function toggleQR() {
            const container = document.getElementById('qrContainer');
            const link      = document.getElementById('shareLink').innerText;

            if (!qrInited) {
                new QRCode(document.getElementById("qrcode"), {
                    text: link,
                    width: 160,
                    height: 160,
                    colorDark:     "#000000",
                    colorLight:    "#ffffff",
                    correctLevel:  QRCode.CorrectLevel.H
                });
                qrInited = true;
            }

            qrVisible = !qrVisible;
            container.style.display = qrVisible ? 'block' : 'none';
        }

        // Drag-and-drop support (desktop)
        const dz = document.getElementById('dropZone');
        dz.ondragover  = (e) => { e.preventDefault(); dz.classList.add('drop-zone--active'); };
        dz.ondragleave = ()  => { dz.classList.remove('drop-zone--active'); };
        dz.ondrop      = (e) => {
            e.preventDefault();
            dz.classList.remove('drop-zone--active');
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files);
        };

        // Update file size stat when transfer info appears
        const origHandleFile = handleFile;
        window.handleFile = function(files) {
            origHandleFile(files);
            if (files && files[0]) {
                document.getElementById('fileSizeText').innerText = formatSize(files[0].size);
            }
        };
    </script>
</body>
</html>
